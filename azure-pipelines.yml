# ============================================================================
# Azure DevOps — validate → build once → deploy staging → promote to production
#
# Branching this matches:
#   feature work  -> push to `dev`            (validation only, no deploy)
#   PR dev        -> `staging`  on merge      -> build image + deploy STAGING
#   PR staging    -> `master`   on merge      -> promote THAT SAME image to PROD
#
# BUILD ONCE, PROMOTE BY DIGEST.
# The master merge commit is a different commit from the staging one, so
# rebuilding on master would ship an image nobody tested — different dependency
# resolution, different base-image patch level. Instead the staging build moves a
# floating `:staging` tag, and the production stage resolves that tag to its
# immutable sha256 DIGEST and deploys the digest. Same bytes, provably.
#
# CONFIG IS DECLARED HERE, VALUES LIVE IN KEY VAULT.
# Each deploy re-declares the app's secrets as Key Vault *references* and maps
# env vars onto them with `secretref:`. The pipeline therefore handles secret
# NAMES, never secret VALUES — nothing sensitive reaches the agent, the logs, or
# the Container App's revision template. The one exception is DATABASE_URL, which
# `prisma migrate deploy` genuinely needs on the agent; it comes from the
# Key Vault-linked variable group.
#
# ONE-TIME SETUP:      docs/azure-devops-setup.md
# PRODUCTION EXTRAS:   docs/production-checklist.md
# ============================================================================

trigger:
  branches:
    include:
      - staging
      - master

pr:
  branches:
    include:
      - staging
      - master

variables:
  # ---- shared --------------------------------------------------------------
  - name: azureSubscription
    value: azure-staging-sc # ARM service connection, scoped to the staging RG
  - name: imageRepo
    value: inventory-web
  # Single registry shared by both environments — that is what makes promotion a
  # retag rather than a cross-registry copy. It lives in the staging RG, so the
  # PRODUCTION stage deliberately keeps `azureSubscription` for its ACR steps and
  # only switches connections to deploy. See docs/production-checklist.md.
  - name: acrName
    value: acrinventorystaging
  - name: acrLoginServer
    value: $(acrName).azurecr.io
  # Immutable, content-addressed tag for this commit.
  - name: shaTag
    value: sha-$(Build.SourceVersion)

  # ---- provider switches ---------------------------------------------------
  # Entra and magic-link sign-in are always live. `authProvider` only controls
  # the credential-free demo user-picker, and only outside production — the
  # Dockerfile bakes NODE_ENV=production, so a deployed image cannot show it
  # whatever this says. It stays `entra` here so nobody has to rely on that.
  - name: authProvider
    value: entra
  - name: emailProvider
    value: acs # set to `local` to defer ACS; sends fail until the sender is real
  - name: translationProvider
    value: local

  # ---- email throughput ----------------------------------------------------
  # The mail provider's send limits for the sender domain in use. Conservative
  # Azure-managed-domain figures; a verified custom domain is roughly 6x on both.
  # Raising throughput is a matter of changing these two numbers and redeploying
  # — there is no code that assumes a particular rate. See docs/email-delivery.md.
  - name: emailRatePerMinute
    value: 5
  - name: emailRatePerHour
    value: 100
  # Per-minute slots held back from the bulk queue so a sign-in link requested
  # during the morning reminder run is not throttled behind it.
  - name: emailInteractiveReserve
    value: 2
  # Only read when translationProvider=azure. Region is required for regional and
  # multi-service Translator resources, ignored for global ones. The ENDPOINT var
  # is deliberately not set anywhere — leaving it unset uses the global endpoint,
  # which is what you want unless the client needs a regional one.
  # NOTE: no Azure AI Translator resource exists yet; see docs/production-checklist.md.
  - name: translatorRegion
    value: westeurope # TODO confirm when the Translator resource is created

  # ---- staging -------------------------------------------------------------
  - name: stagingResourceGroup
    value: rg-inventory-staging
  - name: stagingAcaApp
    value: ca-inventory-web-staging
  - name: stagingKvUri
    value: https://kv-inv-stg-xxxx.vault.azure.net/secrets # TODO real vault name
  # Full resource id of the user-assigned identity that reads the vault:
  #   az identity show -n id-inventory-staging -g rg-inventory-staging --query id -o tsv
  - name: stagingUamiId
    value: /subscriptions/TODO_SUBSCRIPTION_ID/resourceGroups/rg-inventory-staging/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-inventory-staging # TODO
  - name: stagingAcsSender
    value: DoNotReply@xxxxxxxx.azurecomm.net # TODO from the ACS managed domain
  - name: stagingAadTenantId
    value: TODO_TENANT_ID # TODO — unused while authProvider=local
  - name: stagingAadClientId
    value: TODO_STAGING_CLIENT_ID # TODO — app registration inventory-app-staging
  # The hostname users actually visit, once a custom domain is bound to the
  # Container App. APP_URL and the Entra redirect URI are built from it — see the
  # note in the deploy step for why the ingress FQDN is the wrong value for both.
  # Leave EMPTY before the domain is bound and the FQDN is used instead.
  - name: stagingPublicHost
    value: staging.domain3.com # TODO confirm exact host (incl. any www)

  # ---- production ----------------------------------------------------------
  # Flip `productionEnabled` to true once every TODO below is filled and the
  # production RG, ACA app, Environment and variable group exist. Until then the
  # master branch runs validation only, so merging to master cannot fail on
  # infrastructure that does not exist yet.
  - name: productionEnabled
    value: false
  - name: prodAzureSubscription
    value: azure-production-sc # TODO scoped to rg-inventory-production
  - name: prodResourceGroup
    value: rg-inventory-production # TODO confirm when created
  - name: prodAcaApp
    value: ca-inventory-web-production # TODO confirm when created
  - name: prodKvUri
    value: https://kv-inv-prd-xxxx.vault.azure.net/secrets # TODO
  - name: prodUamiId
    value: /subscriptions/TODO_SUBSCRIPTION_ID/resourceGroups/rg-inventory-production/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-inventory-production # TODO
  - name: prodAcsSender
    value: DoNotReply@TODO-client-domain # TODO verified custom domain, not azurecomm.net
  - name: prodAadTenantId
    value: TODO_TENANT_ID # TODO
  - name: prodAadClientId
    value: TODO_PRODUCTION_CLIENT_ID # TODO app registration inventory-app-production
  - name: prodPublicHost
    value: domain3.com # TODO confirm apex vs www — they are different origins

stages:
  # ==========================================================================
  # 1) VALIDATE — runs on every PR and every branch build.
  #    This is the gate the whole promote-by-PR model depends on; without it a
  #    PR merges first and breaks the pipeline afterwards.
  # ==========================================================================
  - stage: Validate
    displayName: Validate (typecheck · lint · build)
    jobs:
      - job: validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: 20.x
          - script: npm ci
            displayName: npm ci
          - script: npx prisma generate
            displayName: prisma generate # types the app compiles against
          - script: npm run typecheck
            displayName: typecheck
          - script: npm run lint
            displayName: lint
          - script: npm run build
            displayName: next build
            env:
              # `next build` may statically analyse a route that imports Prisma.
              # The client only needs a parseable URL at build time — it never
              # connects — so a dummy keeps the build hermetic and DB-free.
              DATABASE_URL: sqlserver://localhost:1433;database=build;user=none;password=none;encrypt=true;trustServerCertificate=true

  # ==========================================================================
  # 2) BUILD — staging branch only. Builds in ACR (no Docker daemon on the
  #    agent) and moves the floating `:staging` tag that production promotes.
  # ==========================================================================
  - stage: Build
    displayName: Build image (staging branch)
    dependsOn: Validate
    condition: >-
      and(succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/staging'),
          ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: az acr build
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr build \
                  --registry $(acrName) \
                  --image $(imageRepo):$(shaTag) \
                  --image $(imageRepo):staging \
                  .

  # ==========================================================================
  # 3) DEPLOY STAGING — migrate, declare config, roll the revision, smoke-check.
  #    Migrations run BEFORE the new image serves traffic, so the schema is
  #    always ahead of or equal to the code reading it.
  # ==========================================================================
  - stage: DeployStaging
    displayName: Deploy → staging
    dependsOn: Build
    condition: succeeded()
    variables:
      - group: inventory-staging-secrets
    jobs:
      - deployment: deploy_staging
        environment: inventory-staging
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do NOT check out the repo by default, and
                # prisma migrate needs prisma/ — so ask for it explicitly.
                - checkout: self
                - task: NodeTool@0
                  inputs:
                    versionSpec: 20.x
                - script: npm ci
                  displayName: npm ci
                # Key Vault secret names cannot contain underscores, so the
                # variable-group variables are hyphenated. These env blocks are
                # where they map onto the underscored names the tooling expects.
                - script: npx prisma migrate deploy
                  displayName: prisma migrate deploy
                  env:
                    DATABASE_URL: $(database-url)
                - script: npm run db:bootstrap
                  displayName: bootstrap roles + first admin (idempotent)
                  env:
                    DATABASE_URL: $(database-url)
                    BOOTSTRAP_ADMIN_EMAIL: $(bootstrap-admin-email)
                    BOOTSTRAP_ADMIN_FIRST_NAME: $(bootstrap-admin-first-name)
                    BOOTSTRAP_ADMIN_LAST_NAME: $(bootstrap-admin-last-name)
                - task: AzureCLI@2
                  displayName: declare config + roll revision + smoke check
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # Quoted: these are ADO macros, and an unfilled TODO value
                      # would otherwise be re-parsed by bash.
                      KV="$(stagingKvUri)"
                      UAMI="$(stagingUamiId)"
                      PUBLIC_HOST="$(stagingPublicHost)"

                      # The ingress FQDN — the *.azurecontainerapps.io hostname.
                      # Used to health-check the new revision directly, which
                      # keeps "is the app up" separate from DNS and certificate
                      # questions about the custom domain.
                      FQDN=$(az containerapp show \
                        --name $(stagingAcaApp) \
                        --resource-group $(stagingResourceGroup) \
                        --query properties.configuration.ingress.fqdn -o tsv)

                      # ...but APP_URL and the Entra redirect URI must be the
                      # host users actually visit. The redirect URI has to match
                      # a registered one byte-for-byte, and it decides which
                      # origin the post-login session cookie is set on: send the
                      # FQDN and a user who signed in at the custom domain is
                      # bounced to azurecontainerapps.io and left with no session
                      # on the domain they started from. APP_URL also builds the
                      # magic-links in outbound mail, which should carry the
                      # client's domain, not ours.
                      PUBLIC_URL="https://${PUBLIC_HOST:-$FQDN}"
                      echo "ingress=$FQDN  public=$PUBLIC_URL"

                      # App-level secrets as Key Vault REFERENCES — pointers, not
                      # values. The platform resolves them at container start via
                      # the user-assigned identity. This is an upsert: re-running
                      # is safe and leaves any secret not listed here untouched.
                      # NOTE: every secret below must already exist in the vault,
                      # or the revision fails to start with an empty log stream.
                      az containerapp secret set \
                        --name $(stagingAcaApp) \
                        --resource-group $(stagingResourceGroup) \
                        --secrets \
                          database-url=keyvaultref:$KV/database-url,identityref:$UAMI \
                          session-secret=keyvaultref:$KV/session-secret,identityref:$UAMI \
                          acs-connection-string=keyvaultref:$KV/acs-connection-string,identityref:$UAMI \
                          cron-secret=keyvaultref:$KV/cron-secret,identityref:$UAMI \
                          magic-link-secret=keyvaultref:$KV/magic-link-secret,identityref:$UAMI \
                          azure-ad-client-secret=keyvaultref:$KV/azure-ad-client-secret,identityref:$UAMI \
                          azure-translator-key=keyvaultref:$KV/azure-translator-key,identityref:$UAMI

                      # One call = one revision, carrying both the new image and
                      # the current config. --set-env-vars MERGES, so anything set
                      # outside the pipeline survives; treat this list as the
                      # source of truth and stop editing env vars in the Portal.
                      az containerapp update \
                        --name $(stagingAcaApp) \
                        --resource-group $(stagingResourceGroup) \
                        --image $(acrLoginServer)/$(imageRepo):$(shaTag) \
                        --set-env-vars \
                          DATABASE_URL=secretref:database-url \
                          SESSION_SECRET=secretref:session-secret \
                          ACS_CONNECTION_STRING=secretref:acs-connection-string \
                          CRON_SECRET=secretref:cron-secret \
                          MAGIC_LINK_SECRET=secretref:magic-link-secret \
                          AZURE_AD_CLIENT_SECRET=secretref:azure-ad-client-secret \
                          AZURE_TRANSLATOR_KEY=secretref:azure-translator-key \
                          AZURE_AD_TENANT_ID="$(stagingAadTenantId)" \
                          AZURE_AD_CLIENT_ID="$(stagingAadClientId)" \
                          AZURE_AD_REDIRECT_URI="$PUBLIC_URL/api/auth/callback" \
                          APP_URL="$PUBLIC_URL" \
                          ACS_SENDER_ADDRESS="$(stagingAcsSender)" \
                          AZURE_TRANSLATOR_REGION="$(translatorRegion)" \
                          AUTH_PROVIDER="$(authProvider)" \
                          EMAIL_PROVIDER="$(emailProvider)" \
                          TRANSLATION_PROVIDER="$(translationProvider)" \
                          EMAIL_RATE_PER_MINUTE="$(emailRatePerMinute)" \
                          EMAIL_RATE_PER_HOUR="$(emailRatePerHour)" \
                          EMAIL_INTERACTIVE_RESERVE="$(emailInteractiveReserve)" \
                          NODE_ENV=production

                      # `containerapp update` returns as soon as the revision is
                      # created, not when it is healthy — so poll before calling
                      # the deploy green.
                      for i in $(seq 1 30); do
                        CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/login" || true)
                        echo "attempt $i: HTTP $CODE"
                        [ "$CODE" = "200" ] && exit 0
                        sleep 10
                      done
                      echo "##vso[task.logissue type=error]Revision did not serve 200 within 5 minutes"
                      echo "Stuck in ProvisioningError with empty logs? A Key Vault secret is missing,"
                      echo "or the identity lacks Key Vault Secrets User on the vault."
                      exit 1

  # ==========================================================================
  # 4) PROMOTE TO PRODUCTION — master branch only, gated by the Environment's
  #    approval. The approval sits BEFORE the migrate step on purpose: once
  #    migrations apply you are committed, because rolling the image back does
  #    NOT roll the schema back. See docs §13 on expand/contract.
  # ==========================================================================
  - stage: PromoteProduction
    displayName: Promote → production
    dependsOn: Validate
    condition: >-
      and(succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/master'),
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['productionEnabled'], 'true'))
    variables:
      - group: inventory-production-secrets
    jobs:
      - deployment: deploy_production
        environment: inventory-production # add the approval check here in the ADO UI
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                # The registry lives in the STAGING resource group, so this task
                # keeps the staging service connection. Only the deploy task at
                # the bottom switches to the production one — do not "fix" this
                # by widening azure-production-sc to subscription scope.
                - task: AzureCLI@2
                  displayName: resolve staging image digest (ACR — staging SC)
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # Deploy by DIGEST, not by tag. A tag can be moved; a digest
                      # is the content hash, so production provably runs the exact
                      # image staging validated.
                      DIGEST=$(az acr repository show \
                        --name $(acrName) \
                        --image $(imageRepo):staging \
                        --query digest -o tsv)
                      echo "Promoting $(imageRepo)@$DIGEST"
                      echo "##vso[task.setvariable variable=imageDigest]$DIGEST"

                      # Traceability: tag the promoted digest so you can see in
                      # ACR which image each production release used.
                      az acr import \
                        --name $(acrName) \
                        --source $(acrLoginServer)/$(imageRepo)@$DIGEST \
                        --image $(imageRepo):prod-$(Build.BuildId) \
                        --force
                - task: NodeTool@0
                  inputs:
                    versionSpec: 20.x
                - script: npm ci
                  displayName: npm ci
                - script: npx prisma migrate deploy
                  displayName: prisma migrate deploy
                  env:
                    DATABASE_URL: $(database-url)
                - script: npm run db:bootstrap
                  displayName: bootstrap roles + first admin (idempotent)
                  env:
                    DATABASE_URL: $(database-url)
                    BOOTSTRAP_ADMIN_EMAIL: $(bootstrap-admin-email)
                    BOOTSTRAP_ADMIN_FIRST_NAME: $(bootstrap-admin-first-name)
                    BOOTSTRAP_ADMIN_LAST_NAME: $(bootstrap-admin-last-name)
                - task: AzureCLI@2
                  displayName: declare config + roll revision + smoke check
                  inputs:
                    azureSubscription: $(prodAzureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      KV="$(prodKvUri)"
                      UAMI="$(prodUamiId)"
                      PUBLIC_HOST="$(prodPublicHost)"

                      FQDN=$(az containerapp show \
                        --name $(prodAcaApp) \
                        --resource-group $(prodResourceGroup) \
                        --query properties.configuration.ingress.fqdn -o tsv)

                      # See the staging stage for why the public host, not the
                      # ingress FQDN, drives APP_URL and the redirect URI.
                      PUBLIC_URL="https://${PUBLIC_HOST:-$FQDN}"
                      echo "ingress=$FQDN  public=$PUBLIC_URL"

                      az containerapp secret set \
                        --name $(prodAcaApp) \
                        --resource-group $(prodResourceGroup) \
                        --secrets \
                          database-url=keyvaultref:$KV/database-url,identityref:$UAMI \
                          session-secret=keyvaultref:$KV/session-secret,identityref:$UAMI \
                          acs-connection-string=keyvaultref:$KV/acs-connection-string,identityref:$UAMI \
                          cron-secret=keyvaultref:$KV/cron-secret,identityref:$UAMI \
                          magic-link-secret=keyvaultref:$KV/magic-link-secret,identityref:$UAMI \
                          azure-ad-client-secret=keyvaultref:$KV/azure-ad-client-secret,identityref:$UAMI \
                          azure-translator-key=keyvaultref:$KV/azure-translator-key,identityref:$UAMI

                      az containerapp update \
                        --name $(prodAcaApp) \
                        --resource-group $(prodResourceGroup) \
                        --image $(acrLoginServer)/$(imageRepo)@$(imageDigest) \
                        --set-env-vars \
                          DATABASE_URL=secretref:database-url \
                          SESSION_SECRET=secretref:session-secret \
                          ACS_CONNECTION_STRING=secretref:acs-connection-string \
                          CRON_SECRET=secretref:cron-secret \
                          MAGIC_LINK_SECRET=secretref:magic-link-secret \
                          AZURE_AD_CLIENT_SECRET=secretref:azure-ad-client-secret \
                          AZURE_TRANSLATOR_KEY=secretref:azure-translator-key \
                          AZURE_AD_TENANT_ID="$(prodAadTenantId)" \
                          AZURE_AD_CLIENT_ID="$(prodAadClientId)" \
                          AZURE_AD_REDIRECT_URI="$PUBLIC_URL/api/auth/callback" \
                          APP_URL="$PUBLIC_URL" \
                          ACS_SENDER_ADDRESS="$(prodAcsSender)" \
                          AZURE_TRANSLATOR_REGION="$(translatorRegion)" \
                          AUTH_PROVIDER="$(authProvider)" \
                          EMAIL_PROVIDER="$(emailProvider)" \
                          TRANSLATION_PROVIDER="$(translationProvider)" \
                          EMAIL_RATE_PER_MINUTE="$(emailRatePerMinute)" \
                          EMAIL_RATE_PER_HOUR="$(emailRatePerHour)" \
                          EMAIL_INTERACTIVE_RESERVE="$(emailInteractiveReserve)" \
                          NODE_ENV=production

                      for i in $(seq 1 30); do
                        CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/login" || true)
                        echo "attempt $i: HTTP $CODE"
                        [ "$CODE" = "200" ] && exit 0
                        sleep 10
                      done
                      echo "##vso[task.logissue type=error]Revision did not serve 200 within 5 minutes"
                      exit 1
